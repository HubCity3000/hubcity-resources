  - action: download_github
    dest: ./resources/[qbx]/qbx_diving
    ref: main
    src: https://github.com/qbox-project/qbx_diving
  - action: download_github
    dest: ./resources/[qbx]/qbx_divegear
    ref: main
    src: https://github.com/qbox-project/qbx_divegear
  - action: download_github
    dest: ./resources/[qbx]/qbx_cityhall
    ref: main
    src: https://github.com/qbox-project/qbx_cityhall
  - action: download_github
    dest: ./resources/[qbx]/qbx_truckrobbery
    ref: main
    src: https://github.com/qbox-project/qbx_truckrobbery
  - action: download_github
    dest: ./resources/[qbx]/qbx_pawnshop
    ref: main
    src: https://github.com/qbox-project/qbx_pawnshop
  - action: download_github
    dest: ./resources/[qbx]/qbx_taxijob
    ref: main
    src: https://github.com/qbox-project/qbx_taxijob
  - action: download_github
    dest: ./resources/[qbx]/qbx_busjob
    ref: main
    src: https://github.com/qbox-project/qbx_busjob
  - action: download_github
    dest: ./resources/[qbx]/qbx_newsjob
    ref: main
    src: https://github.com/qbox-project/qbx_newsjob
  - action: download_github
    dest: ./resources/[qbx]/qbx_jewelery
    ref: main
    src: https://github.com/qbox-project/qbx_jewelery
  - action: download_github
    dest: ./resources/[qbx]/qbx_bankrobbery
    ref: main
    src: https://github.com/qbox-project/qbx_bankrobbery
  - action: download_github
    dest: ./resources/[qbx]/qbx_truckerjob
    ref: main
    src: https://github.com/qbox-project/qbx_truckerjob
  - action: download_github
    dest: ./resources/[qbx]/qbx_garbagejob
    ref: main
    src: https://github.com/qbox-project/qbx_garbagejob
  - action: download_github
    dest: ./resources/[qbx]/qbx_drugs
    ref: main
    src: https://github.com/qbox-project/qbx_drugs
  - action: query_database
    file: ./resources/[qbx]/qbx_drugs/qbx_drugs.sql
  - action: waste_time # prevent github throttling
    seconds: 10
  - action: download_github
    dest: ./resources/[qbx]/qbx_idcard
    ref: main
    src: https://github.com/Qbox-project/qbx_idcard
  - action: download_github
    dest: ./resources/[qbx]/qbx_binoculars
    ref: main
    src: https://github.com/Qbox-project/qbx_binoculars
  - action: download_github
    dest: ./resources/[qbx]/qbx_carwash
    ref: main
    src: https://github.com/Qbox-project/qbx_carwash
  - action: download_github
    dest: ./resources/[qbx]/qbx_fireworks
    ref: main
    src: https://github.com/Qbox-project/qbx_fireworks
  - action: download_github
    dest: ./resources/[qbx]/qbx_density
    ref: main
    src: https://github.com/Qbox-project/qbx_density
  - action: download_github
    dest: ./resources/[qbx]/qbx_customs
    ref: main
    src: https://github.com/Qbox-project/qbx_customs
  - action: download_github
    dest: ./resources/[qbx]/qbx_chat_theme
    ref: main
    src: https://github.com/Qbox-project/qbx_chat_theme

  # OX
  - action: download_file
    path: ./tmp/ox_lib.zip
    url: https://github.com/overextended/ox_lib/releases/latest/download/ox_lib.zip
  - action: unzip
    dest: ./resources/[ox]
    src: ./tmp/ox_lib.zip
  - action: download_file
    path: ./tmp/ox_target.zip
    url: https://github.com/overextended/ox_target/releases/latest/download/ox_target.zip
  - action: unzip
    dest: ./resources/[ox]
    src: ./tmp/ox_target.zip
  - action: download_file
    path: ./tmp/oxmysql.zip
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
  - action: unzip
    dest: ./resources/[ox]
    src: ./tmp/oxmysql.zip
  - action: download_file
    path: ./tmp/ox_doorlock.zip
    url: https://github.com/overextended/ox_doorlock/releases/latest/download/ox_doorlock.zip
  - action: unzip
    dest: ./resources/[ox]
    src: ./tmp/ox_doorlock.zip
  - action: download_file
    path: ./tmp/ox_inventory.zip
    url: https://github.com/overextended/ox_inventory/releases/latest/download/ox_inventory.zip
  - action: unzip
    dest: ./resources/[ox]
    src: ./tmp/ox_inventory.zip
  - action: move_path
    src: ./tmp/qbox/items.lua
    dest: ./resources/[ox]/ox_inventory/data/items.lua
    overwrite: true
  - action: download_github
    dest: ./tmp/qbox/
    ref: main
    src: https://github.com/Qbox-project/qbx_invimages
  - action: move_path
    src: ./tmp/qbox/images
    dest: ./resources/[ox]/ox_inventory/web/images
    overwrite: true
  - action: download_github
    dest: ./resources/[ox]/ox_fuel
    ref: main
    src: https://github.com/overextended/ox_fuel

  # NPWD
  - action: download_file
    path: ./tmp/npwd.zip
    url: https://github.com/project-error/npwd/releases/download/3.16.0/npwd.zip
  - action: unzip
    dest: ./resources/[npwd]/
    src: ./tmp/npwd.zip
  - action: query_database
    file: ./resources/[npwd]/npwd/import.sql
  - action: download_github
    dest: ./resources/[npwd]/qbx_npwd
    ref: main
    src: https://github.com/Qbox-project/qbx_npwd
  - action: move_path
    src: ./resources/[npwd]/qbx_npwd/config.json
    dest: ./resources/[npwd]/npwd/config.json
    overwrite: true
  - action: download_file
    path: ./tmp/npwd_qbx_garages.zip
    url: https://github.com/Qbox-project/npwd_qbx_garages/releases/latest/download/npwd_qbx_garages.zip
  - action: unzip
    dest: ./resources/[npwd-apps]
    src: ./tmp/npwd_qbx_garages.zip
  - action: download_file
    path: ./tmp/npwd_qbx_mail.zip
    url: https://github.com/Qbox-project/npwd_qbx_mail/releases/latest/download/npwd_qbx_mail.zip
  - action: unzip
    dest: ./resources/[npwd-apps]
    src: ./tmp/npwd_qbx_mail.zip
  - action: download_github
    dest: ./resources/[assets]/pillbox
    ref: main
    src: https://github.com/Lorenc95/pillbox

  # =====================================================================
  #  HUB CITY ADDITIONS (everything above this line is the stock recipe)
  #  Custom resources live in Daniel's own repo - swap the placeholder
  #  owner/repo below for the real one before deploying.
  # =====================================================================

  # Clone every Hub City resource into resources/[hubcity]/
  # (bailbonds, raiderville, zones, applications, tablet, loans,
  # laundering, dragrace, streetrace, crafting, noose)
  - action: download_github
    src: https://github.com/HubCity3000/hubcity-resources
    ref: main
    subpath: resources/[hubcity]
    dest: ./resources/[hubcity]

  # Hub City database tables (the resources also auto-create these on
  # first start - importing here means first boot is already complete)
  - action: query_database
    file: ./resources/[hubcity]/hubcity-applications/sql/hubcity_applications.sql
  - action: query_database
    file: ./resources/[hubcity]/hubcity-tablet/sql/hubcity_deals.sql
  - action: query_database
    file: ./resources/[hubcity]/hubcity-loans/sql/hubcity_loans.sql
  - action: query_database
    file: ./resources/[hubcity]/hubcity-dragrace/sql/hubcity_drag_times.sql
  - action: query_database
    file: ./resources/[hubcity]/hubcity-streetrace/sql/hubcity_streetrace_records.sql
  - action: query_database
    file: ./resources/[hubcity]/hubcity-noose/sql/hubcity_noose.sql

  # server.cfg: Hub City values, appended AFTER the stock recipe's own
  # server.cfg so these lines win. The stock cfg sets its own
  # qbx:discordLink earlier in the file - a later `set` overrides it,
  # which is exactly what we want (the permanent Hub City invite).
  # Ensure order follows the pack's INSTALL.md Step 3, plus
  # hubcity-zones (framework-free) after raiderville; laundering stays
  # before tablet because the tablet reads its export.
  - action: write_file
    file: ./server.cfg
    append: true
    data: |

      # ===== Hub City Roleplay 5M (added by the Hub City recipe) =====
      set qbx:discordLink "discord.gg/VrG5KcHFPC"
      ensure hubcity-bailbonds
      ensure hubcity-raiderville
      ensure hubcity-zones
      ensure hubcity-applications
      ensure hubcity-laundering
      ensure hubcity-tablet
      ensure hubcity-streetrace
      ensure hubcity-loans
      ensure hubcity-dragrace
      ensure hubcity-crafting
      ensure hubcity-noose

  # Clean up (the base recipe's own final task - kept last)
  - action: remove_path
    path: ./tmp
